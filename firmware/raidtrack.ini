; RaidTrack — ambientes PlatformIO.
; Copiar para <meshtastic>/variants/raidtrack/raidtrack.ini
; (o platformio.ini do Meshtastic já inclui variants/*/*.ini automaticamente)
;
; Compilar:
;   pio run -e raidtrack-equipa   -> T-Beam V1.2 (trackers das equipas)
;   pio run -e raidtrack-base     -> T3-S3 (recetor da base)

[env:raidtrack-equipa]
extends = env:tbeam
custom_meshtastic_display_name = RaidTrack Equipa (T-Beam)
build_flags =
  ${env:tbeam.build_flags}
  -D RAIDTRACK_ROLE_TEAM
  -D RAIDTRACK_SOS_PIN=14
  -D RAIDTRACK_BUZZER_PIN=2
  ; Módulos que não usamos — liberta RAM/flash e tempo de antena
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  -D MESHTASTIC_EXCLUDE_DROPZONE=1

[env:raidtrack-base]
extends = env:tlora-t3s3-v1
custom_meshtastic_display_name = RaidTrack Base (T3-S3)
build_flags =
  ${env:tlora-t3s3-v1.build_flags}
  -D RAIDTRACK_ROLE_BASE
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_ATAK=1
  -D MESHTASTIC_EXCLUDE_POWERSTRESS=1
  -D MESHTASTIC_EXCLUDE_DROPZONE=1
